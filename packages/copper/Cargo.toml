[package]
name = "cu"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.41", features = ["derive"] }
dunce = "1.0.5"
env_filter = "0.1.3"
log = "0.4.27"
oneshot = "0.1.11"
pathdiff = "0.2.3"
serde = "1.0.219"
serde_json = "1.0.141"
serde_yaml_ng = "0.10.0"
terminal_size = "0.4.2"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["full"] }
toml = "0.9.2"
unicode-width = { version = "0.2.1", features = ["cjk"] }


[features]
default = []
# Utils to show prompt, as well as CLI flags
prompt = []

[[example]]
name = "print"
required-features = ["prompt"]
